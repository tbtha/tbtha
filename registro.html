        <section class="py-5">
          <h2 class="text-center mb-4">Accede a tu cuenta</h2>

          <!-- Botones -->
          <div class="text-center mb-4">
            <button class="btn btn-outline-dark me-2" onclick="mostrarFormulario('login')">Iniciar sesión</button>
            <button class="btn btn-outline-dark" onclick="mostrarFormulario('registro')">Registrarse</button>
          </div>

          <!-- Formulario de inicio de sesión -->
          <div id="form-login" class="col-md-6 mx-auto">
            <div class="card shadow-sm">
              <div class="card-body">
                <h4 class="card-title mb-4 text-center">Iniciar sesión</h4>
                <form>
                  <div class="mb-3">
                    <label for="emailLogin" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="emailLogin" required>
                  </div>
                  <div class="mb-3">
                    <label for="passwordLogin" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="passwordLogin" required>
                  </div>
                  <div class="text-end">
                    <button type="submit" class="btn btn-dark">Entrar</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <!-- Formulario de registro -->
          <div id="form-registro" class="col-md-6 mx-auto d-none">
            <div class="card shadow-sm mt-4">
              <div class="card-body">
                <h4 class="card-title mb-4 text-center">Registro</h4>
                <form>
                  <div class="mb-3">
                    <label for="nombreRegistro" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombreRegistro" required>
                  </div>
                  <!--agregar region con box-->
                  <!--agregar comuna con box-->
                  <div class="mb-3">
                    <label for="emailRegistro" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="emailRegistro" required>
                  </div>
                  <div class="mb-3">
                    <label for="passwordRegistro" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="passwordRegistro" required>
                  </div>
                  <div class="text-end">
                    <button type="submit" class="btn btn-dark">Registrarse</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </section>

        <!-- Script para alternar formularios -->
        <script>
          function mostrarFormulario(tipo) {
            const login = document.getElementById('form-login');
            const registro = document.getElementById('form-registro');

            if (tipo === 'login') {
              login.classList.remove('d-none');
              registro.classList.add('d-none');
            } else {
              registro.classList.remove('d-none');
              login.classList.add('d-none');
            }
          }
        </script>
